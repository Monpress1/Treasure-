<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vee Fashion House</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--m:#7A0B2E;--dk:#2B0D14;--pk:#F8E6EB;--g:#6b6b6b}
body{font-family:Montserrat,system-ui,sans-serif;color:#1d1d1d;background:#ece6e7;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}
.app{max-width:1200px;margin:0 auto;background:#fff;min-height:100vh;padding-bottom:104px;box-shadow:0 0 40px rgba(0,0,0,.08)}
.view{animation:f .3s ease}
@keyframes f{from{opacity:0;transform:translateY(8px)}}
header{position:sticky;top:0;z-index:30;padding:12px 14px;background:#fff;box-shadow:0 1px 0 #f0e6e9}
.top{display:flex;align-items:center;gap:8px}
.ib{position:relative;background:rgba(255,255,255,.92);border:0;color:#2B0D14;font-size:19px;width:42px;height:42px;box-shadow:0 2px 8px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:50%}
.ib .b{position:absolute;top:2px;right:0;background:var(--m);color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:none;align-items:center;justify-content:center;padding:0 4px;border:2px solid #fff}
.ib .b.s{display:flex}
.srch{flex:1;height:42px;border-radius:22px;background:#f6f3f4;display:flex;align-items:center;gap:10px;padding:0 16px;color:#8a8a8a;font-size:14px;border:0;text-align:left;min-width:0}
.wrap{padding:0 14px}
.sec{display:flex;justify-content:space-between;align-items:center;padding:20px 14px 10px}
.sec h2,.pg{font-size:21px;font-weight:800;color:var(--dk)}
.pg{padding:14px 0 6px}
.sec button{background:none;border:0;color:var(--m);font-weight:700;font-size:13px}
.sl{position:relative;margin:14px 14px 0}
.trk{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-behavior:smooth;border-radius:22px}
.trk::-webkit-scrollbar{display:none}
.bnimg{width:100%;aspect-ratio:1.94;object-fit:cover;border-radius:22px;display:block}
.trk>*{flex:0 0 100%;scroll-snap-align:start;min-width:0}
.dots{display:flex;justify-content:center;gap:7px;margin-top:10px}
.dot{width:8px;height:8px;border-radius:4px;border:0;background:#d9c7cc;padding:0;transition:width .3s}
.dot.on{background:var(--m);width:22px}
.hslide{display:grid;grid-template-columns:104px 1fr;gap:10px;padding:8px;background:#f4f4f4;border-radius:14px;cursor:pointer;align-items:center;max-width:320px;margin:0 auto}
.hslide .txt{display:flex;flex-direction:column;gap:8px;justify-content:center}
.hslide h3{font-size:14px;font-weight:700;color:#111;line-height:1.25}
.hslide p{font-size:12px;color:#555;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cn{font-size:11px;font-weight:700;color:#b7791f;text-transform:uppercase;letter-spacing:.5px}
.pic{position:relative;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:#fff}
.im{position:relative;aspect-ratio:1/1;background:#f2f2f2;overflow:hidden}
.im img,.pic img{width:100%;height:100%;object-fit:cover;display:block}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.trk.h{gap:12px}.trk.h>*{flex:0 0 calc(50% - 6px)}.hc .im{aspect-ratio:4/3}
.ph{position:relative;overflow:hidden;width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:48px;color:#555;background:#ececec}
.tag{position:absolute;top:8px;left:8px;background:#111;color:#fff;font-size:11px;font-weight:800;padding:4px 8px;border-radius:7px;z-index:2}
.pr{font-size:20px;font-weight:800;color:#111}
.old{font-size:13px;color:#9a9a9a;text-decoration:line-through;margin-left:6px}
.stars{color:#f5b301;font-size:12px}
.btn{background:var(--m);color:#fff;border:0;border-radius:14px;padding:14px 18px;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn.gh{background:#fff;color:var(--m);border:1.5px solid var(--m)}
.btn:disabled{opacity:.7}
.cats{display:flex;gap:12px;overflow-x:auto;padding:18px 14px 4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;width:80px;text-align:center;font-size:11px;font-weight:600;background:none;border:0;color:#1d1d1d}
.ci{height:30px;width:auto;max-width:52px;object-fit:contain}
.cat .t{height:62px;border-radius:16px;background:#faf3f5;box-shadow:0 2px 6px rgba(0,0,0,.06);display:flex;align-items:center;justify-content:center;margin-bottom:6px;color:var(--m);font-size:22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 14px 6px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}.hslide{max-width:420px;grid-template-columns:130px 1fr;padding:10px}.hslide h3{font-size:16px}}
.grid>.empty{grid-column:1/-1}
.card{background:#fff;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.08);overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.fv{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;background:#fff;border:0;color:#222;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.12);z-index:2}
.fv.on{color:var(--m)}
.info{padding:10px 12px 12px;display:flex;justify-content:space-between;align-items:flex-end;gap:6px;flex:1}
.nm{font-size:13px;font-weight:600;margin-bottom:4px;line-height:1.3}
.card .pr{font-size:14px}
.card .old{font-size:11px}
.add{width:38px;height:38px;border-radius:50%;background:#111;color:#fff;border:0;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:15px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 14px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid #e6dcdf;background:#fff;border-radius:22px;padding:9px 14px;font-size:12px;font-weight:700;display:flex;gap:6px;align-items:center;color:#333}
.chip.on{background:var(--m);color:#fff;border-color:var(--m)}
.bar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:12px;color:var(--g)}
select.sort{border:1px solid #e6dcdf;border-radius:8px;padding:7px 8px;font-size:12px;background:#fff}
.pill-in{width:100%;padding:13px 14px;border:1.5px solid #e6dcdf;border-radius:12px;font-size:14px;background:#fff;outline:none}
.pill-in:focus{border-color:var(--m)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;font-size:12px;font-weight:700;color:#444}
.row{display:flex;gap:10px;align-items:center}
.pdg{display:block}
.pdi{border-radius:0}
.back{position:absolute;top:12px;left:12px;z-index:3;width:40px;height:40px;border-radius:50%;background:#fff;border:0;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.det{padding:16px 14px}
.det small{font-size:11px;font-weight:700;color:#b7791f;text-transform:uppercase}
.det h1{font-size:22px;font-weight:800;color:var(--dk);margin:6px 0;line-height:1.25}
.rv{font-size:12px;color:#666;display:flex;gap:6px;align-items:center}
.pp{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:14px 0}
.save{background:#eee;color:#111;font-size:11px;font-weight:800;padding:4px 8px;border-radius:6px}
.lbl{font-size:13px;font-weight:700;margin-top:6px}
.sizes{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
.sz{min-width:46px;padding:10px;border:1.5px solid #e6dcdf;border-radius:10px;background:#fff;font-weight:700;font-size:13px}
.sz.on{border-color:var(--m);background:#fbeef1;color:var(--m)}
.desc{font-size:13px;color:#555;line-height:1.6}
.act{display:flex;gap:10px;margin-top:18px}
.ibig{width:52px;height:52px;border-radius:14px;border:1.5px solid #e6dcdf;background:#fff;color:var(--m);font-size:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
@media(min-width:800px){.pdg{display:grid;grid-template-columns:1fr 1fr;gap:30px;padding:20px 14px;align-items:start}.pdi{border-radius:20px;overflow:hidden}.det{padding:0}.back{top:12px}}
.li{display:flex;gap:12px;background:#fff;border:1px solid #f0e6e9;border-radius:16px;padding:10px;margin:0 14px 10px}
.li .im{width:84px;height:84px;flex-shrink:0;border-radius:12px}
.qty{display:inline-flex;align-items:center;background:#f4f1f2;border-radius:10px}
.qty button{width:34px;height:34px;border:0;background:none;font-size:16px;font-weight:700}
.qty span{min-width:26px;text-align:center;font-weight:700}
.rm{background:none;border:0;color:#999;font-size:16px;padding:6px}
.sum{margin:12px 14px;background:#fff;border:1px solid #f0e6e9;border-radius:16px;padding:16px}
.sum div{display:flex;justify-content:space-between;font-size:14px;margin:6px 0;color:#555}
.sum .tot{font-weight:800;font-size:17px;color:var(--dk);border-top:1px solid #f0e6e9;padding-top:10px;margin-top:10px}
.note{font-size:12px;color:var(--g);margin:10px 14px;line-height:1.5}
.empty{text-align:center;padding:50px 20px;color:#777}
.empty i{font-size:46px;color:#d7c5cb;margin-bottom:12px}
.empty h3{font-size:17px;color:#222;margin-bottom:6px}
.empty p{font-size:13px}
.steps{display:flex;gap:8px;justify-content:center;padding:14px;align-items:center}
.step{width:30px;height:30px;border-radius:50%;background:#eee;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#888}
.step.on{background:var(--m);color:#fff}
.step.ok{background:#00A859;color:#fff}
.mp{margin:14px;border-radius:20px;background:#00A859;color:#fff;padding:22px;text-align:center}
.mp i{font-size:36px}
.mp b{display:block;font-size:20px;margin:8px 0 4px}
.mp p{font-size:13px;opacity:.95}
.prof{background:linear-gradient(135deg,var(--m),#d97706);color:#fff;border-radius:20px;padding:20px;display:flex;gap:14px;align-items:center;margin-top:14px}
.prof i{font-size:44px}
.prof h3{font-size:16px}
.prof small{font-size:12px;opacity:.9}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.stats div{background:#fff;border:1px solid #f0e6e9;border-radius:14px;text-align:center;padding:12px}
.stats b{display:block;font-size:20px;color:var(--dk)}
.stats span{font-size:11px;color:#777}
.sub{font-size:16px;margin:18px 0 8px;color:var(--dk)}
.ord{display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid #f0e6e9;border-radius:12px;margin-bottom:8px}
.ord small{display:block;color:#777;margin-top:2px}
.lnk{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid #f0e6e9;border-radius:12px;margin-bottom:8px;font-size:14px;color:#222;text-decoration:none}
.lnk i{color:var(--m);width:20px}
.muted{font-size:13px;color:#888}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:none}
.ov.s{display:block}
.dr{position:fixed;top:0;bottom:0;left:0;width:82%;max-width:320px;background:#fff;z-index:41;transform:translateX(-102%);transition:transform .3s;padding:22px 18px;overflow-y:auto}
.dr.s{transform:none}
.dr{padding:0 0 22px}
.dblob{position:relative;height:150px;overflow:hidden;margin-bottom:8px}
.dblob svg{position:absolute;inset:0;width:100%;height:100%}
.dblob .lg{position:absolute;left:18px;bottom:16px;font-weight:700;font-size:17px;color:var(--dk)}
.dr .lg{font-weight:800;font-size:17px;color:var(--dk);margin:0 18px 12px}
.dr button{padding-left:18px;padding-right:18px}
.dfoot{height:70px;margin-top:20px}
.dfoot svg{width:100%;height:100%;display:block}
.dr .lg span{color:var(--m)}
.dr h4{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.5px;margin:16px 0 4px}
.dr button{display:flex;align-items:center;gap:12px;padding:12px 4px;font-size:14px;font-weight:600;color:#222;border:0;background:none;width:100%;text-align:left;border-bottom:1px solid #f4eef0}
.dr button i{width:20px;color:var(--m)}
.nav,.dr{font-family:Poppins,sans-serif}
.nav{position:fixed;bottom:0;left:0;right:0;margin:0 auto;max-width:1200px;background:#fff;box-shadow:0 -4px 16px rgba(0,0,0,.08);display:grid;grid-template-columns:repeat(5,1fr);padding:10px 0 calc(12px + env(safe-area-inset-bottom,0px));z-index:30}
.nv{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:600;color:#555;position:relative;padding-top:2px}
.nv i{font-size:19px}
.nv.on{color:var(--m);font-weight:700}
.nv.on::after{content:"";position:absolute;bottom:-11px;width:50px;height:3px;border-radius:3px;background:var(--m)}
.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:60;white-space:nowrap}
.toast.s{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--m);outline-offset:2px}
.nav,.dr{font-family:Nunito,sans-serif}
.nv{font-size:12px;font-weight:800;letter-spacing:.2px;color:#4a2a33}
.nv.on{color:var(--m)}
.dr .lg{font-family:Nunito,sans-serif;font-weight:900;font-size:19px;letter-spacing:.3px;color:var(--m);margin:0 18px 10px}
.dr button{font-size:15px;font-weight:700;letter-spacing:.2px;color:#2B0D14;padding-top:14px;padding-bottom:14px}
.dr button i{color:var(--m);font-size:16px}
.dr h4{font-size:13px;font-weight:800;color:var(--m);text-transform:none;letter-spacing:.3px;margin:20px 4px 6px}
.dblob .lg{font-size:20px;font-weight:900}

header{position:sticky;top:0;z-index:30;padding:14px 14px 18px;background:linear-gradient(110deg,#6A0A29 0%,#8E1038 28%,#E9BFCB 62%,#F9E9EE 100%);box-shadow:none}
.top{gap:10px}
.ib{background:none;box-shadow:none;border-radius:0;width:34px;height:46px;color:#7A0B2E}
.ib svg{width:28px;height:28px;display:block}
.ib.mn{color:#fff;width:32px}
.ib.mn svg{width:30px;height:30px}
.ib .b{top:3px;right:-5px;background:#7A0B2E;color:#fff;border:2px solid #fff;font-size:10px;font-weight:700;min-width:19px;height:19px}
#bc{display:flex}
.srch{height:46px;border-radius:23px;background:#fff;box-shadow:0 4px 14px rgba(60,0,15,.16);color:#9a8f93;font-size:14px;font-weight:500;gap:10px;padding:0 16px}
.srch svg{width:20px;height:20px;flex-shrink:0}
#bnw{margin:8px 0 0}
#bnw .trk{border-radius:24px}
.bnimg{border-radius:0}
#bnd{position:absolute;left:0;right:0;bottom:12px;margin:0;gap:9px}
#bnd .dot,#bnd .dot.on{width:10px;height:10px;border-radius:50%}
#bnd .dot{background:#fff;opacity:.95}
#bnd .dot.on{background:#7A0B2E}
.sec{padding:22px 16px 12px}
.sec h2{font-size:24px;font-weight:800;color:#7A0B2E;letter-spacing:-.2px}
.sec button{font-size:14px;font-weight:700;color:#7A0B2E}
.cats{gap:8px;padding:16px 12px 4px}
.cat{width:auto;min-width:64px;padding:11px 9px 9px;border-radius:16px;background:#fff;border:1px solid #f1e4e8;box-shadow:0 3px 10px rgba(122,11,46,.07);display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11.5px;font-weight:600;color:#2B0D14}
.cat .ci{height:30px;width:auto;max-width:44px}
.cind{width:116px;height:4px;border-radius:2px;background:#eadde1;margin:12px auto 0;position:relative}
.cind i{position:absolute;left:0;top:0;height:4px;width:40%;border-radius:2px;background:#7A0B2E}
.card{border-radius:18px;border:1px solid #f1e4e8;box-shadow:0 3px 12px rgba(122,11,46,.08)}
.card .im{aspect-ratio:1.45/1;background:#fbf3f5}
.hc .im{aspect-ratio:4/3}
.fv{top:10px;right:10px;width:34px;height:34px;color:#2B0D14}
.fv svg{width:18px;height:18px}
.fv.on{color:#7A0B2E}
.ibig svg{width:22px;height:22px}
.info{padding:11px 12px 12px;align-items:center}
.nm{font-size:13.5px;font-weight:500;color:#222;margin-bottom:5px}
.card .pr{font-size:15px;font-weight:800;color:#7A0B2E}
.card .old{font-size:11px;margin-left:5px}
.add{width:38px;height:38px;background:#7A0B2E;color:#fff}
.add svg{width:18px;height:18px}
.nav{padding:10px 0 calc(14px + env(safe-area-inset-bottom,0px));border-radius:0}
.nv{gap:5px;font-size:12.5px;font-weight:700;color:#2B0D14}
.nv svg{width:26px;height:26px}
.nv.on{color:#7A0B2E;font-weight:800}
.nv.on::after{bottom:-10px;width:60px;height:3px}
.ph{font-size:11px;color:#9a8f93}
.cat .ci{background:none;mix-blend-mode:multiply}
</style>
</head>
<body>
<div class="app">
  <header>
<div class="top">
<button class="ib mn" onclick="menu(1)" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>

<button class="ib" onclick="go('cart')" aria-label="Cart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h3l2.7 12.4a2 2 0 0 0 2 1.6h8.6a2 2 0 0 0 2-1.5L22 7H6"/><circle cx="10" cy="20.5" r="1.4"/><circle cx="18" cy="20.5" r="1.4"/></svg><span class="b" id="bc">0</span></button>
</div>
</header>
  <main id="app"></main>
</div>

<div class="toast" id="toast"></div>

const ZN=[[250,'Zone 1 · Major towns'],[400,'Zone 2 · Other towns'],[600,'Zone 3 · Remote areas']];

let S={v:'home',prev:'home',pid:0,sz:'',cat:'All',q:'',sort:'pop',cart:[],wish:[],orders:[],step:1,f:{},zone:250,last:null};
try{const d=JSON.parse(localStorage.getItem('vf')||'{}');S.cart=d.cart||[];S.wish=d.wish||[];S.orders=d.orders||[]}catch(e){}
let TM=[];
const $=i=>document.getElementById(i);
const K=n=>'KSh '+n.toLocaleString('en-KE');
const pr=id=>P.find(x=>x.id===id);
const P=PR;
const HEART=on=>`<svg viewBox="0 0 24 24" fill="${on?'currentColor':'none'}" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21.3l8.8-8.9a5.5 5.5 0 0 0 0-7.8z"/></svg>`;
const CART='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h3l2.7 12.4a2 2 0 0 0 2 1.6h8.6a2 2 0 0 0 2-1.5L22 7H6"/><circle cx="10" cy="20.5" r="1.4"/><circle cx="18" cy="20.5" r="1.4"/></svg>';
const off=p=>Math.round((p.o-p.p)/p.o*100);
const sizes=p=>p.c==='Shoes'?['39','40','41','42','43','44']:(['Men','Women','Hoodies'].includes(p.c)?['S','M','L','XL']:[]);
const qty=()=>S.cart.reduce((a,i)=>a+i.n,0);
const sub=()=>S.cart.reduce((a,i)=>a+pr(i.id).p*i.n,0);
const ship=()=>(!S.cart.length||sub()>=10000)?0:S.zone;
const save=()=>{try{localStorage.setItem('vf',JSON.stringify({cart:S.cart,wish:S.wish,orders:S.orders}))}catch(e){}};
const rv=p=>40+(p.id*13)%90;
const stars=r=>`<span class="stars">${[1,2,3,4,5].map(i=>`<i class="fa-${i<=Math.round(r)?'solid':'regular'} fa-star"></i>`).join('')}</span>`;
const pic=p=>`<div class="ph" style="background:${p.bg}">${p.im?`<img src="${p.im}" alt="${p.n}" loading="lazy">`:''}</div>`;
const empty=(ic,t,s,b,v)=>`<div class="empty"><i class="fa-solid ${ic}"></i><h3>${t}</h3><p>${s}</p>${b?`<button class="btn" style="width:auto;margin:16px auto 0;padding:12px 22px" onclick="go('${v}')">${b}</button>`:''}</div>`;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('s');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('s'),1700)}
function upd(){const n=qty(),w=S.wish.length;$('bc').textContent=n;$('bw').textContent=w;$('bw').classList.toggle('s',w>0);save()}

function card(p){const w=S.wish.includes(p.id);
 return `<div class="card" onclick="openP(${p.id})"><div class="im"><button class="fv ${w?'on':''}" data-w="${p.id}" onclick="event.stopPropagation();togW(${p.id})" aria-label="Save">${HEART(w)}</button>${pic(p)}</div>
<div class="info"><div><div class="nm">${p.n}</div><span class="pr">${K(p.p)}</span><span class="old">${K(p.o)}</span></div>
<button class="add" aria-label="Add to cart" onclick="event.stopPropagation();addC(${p.id})">${CART}</button></div></div>`}

function slider(id,items,per=1){const n=Math.ceil(items.length/per);return `<div class="sl" id="${id}w"><div class="trk${per>1?' h':''}" id="${id}t">${items.join('')}</div><div class="dots" id="${id}d">${Array.from({length:n},(_,i)=>`<button class="dot${i?'':' on'}" onclick="sg('${id}',${i})" aria-label="Slide ${i+1}"></button>`).join('')}</div></div>`}
function sg(id,i){const t=$(id+'t');t.scrollTo({left:i*t.clientWidth,behavior:'smooth'})}
function initS(id,n,ms){const t=$(id+'t');if(!t)return;const ds=$(id+'d').children;
 t.addEventListener('scroll',()=>{const i=Math.round(t.scrollLeft/t.clientWidth);[...ds].forEach((d,j)=>d.classList.toggle('on',j===i))},{passive:true});
 TM.push(setInterval(()=>{const i=Math.round(t.scrollLeft/t.clientWidth);sg(id,(i+1)%n)},ms))}

const hotSlide=p=>`<div class="card hc" onclick="openP(${p.id})"><div class="im"><span class="tag">-${off(p)}%</span>${pic(p)}</div><div style="padding:8px 10px 10px"><div class="nm" style="font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.n}</div><span class="pr" style="font-size:13px">${K(p.p)}</span> <span class="old" style="font-size:10px">${K(p.o)}</span></div></div>`;

const V={};
V.home=()=>{const hot=P.filter(p=>p.h);
 return slider('bn',BN.map((b,i)=>`<img class="bnimg" src="${b}" alt="Vee Fashion House" ${i===2?'style="object-position:right"':''}>`))+
 `<div class="sec" style="padding-bottom:0"><h2>Hot Deals</h2><button onclick="go('shop')">See all <i class="fa-solid fa-arrow-right"></i></button></div>`+slider('hot',hot.map(hotSlide),2)+
 `<div class="cats" id="cats">${CATS.slice(1,7).map(c=>`<button class="cat" onclick="setCat('${c[0]}')"><img class="ci" src="${CI[c[0]]}" alt=""><span>${c[0]}</span></button>`).join('')}<button class="cat" onclick="go('shop')"><img class="ci" src="${CI.More}" alt=""><span>More</span></button></div><div class="cind"><i id="cthumb"></i></div>`+
 `<div class="sec"><h2>New Arrivals</h2><button onclick="go('shop')">View All <i class="fa-solid fa-arrow-right"></i></button></div><div class="grid">${P.slice(0,8).map(card).join('')}</div>`};

V.shop=()=>`<div class="wrap" style="padding-top:12px"><input class="pill-in" id="sq" placeholder="Search Kitenge, hoodies, suits, sneakers..." value="${S.q}" oninput="S.q=this.value;gridRender()"></div>
<div class="chips">${CATS.map(c=>`<button class="chip ${S.cat===c[0]?'on':''}" onclick="setCat('${c[0]}')"><i class="fa-solid ${c[1]}"></i>${c[0]}</button>`).join('')}</div>
<div class="bar"><span id="cnt"></span><select class="sort" onchange="S.sort=this.value;gridRender()">${[['pop','Most popular'],['rate','Top rated'],['low','Price: low to high'],['high','Price: high to low']].map(o=>`<option value="${o[0]}" ${S.sort===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div><div class="grid" id="grid"></div>`;

V.product=()=>{const p=pr(S.pid);if(!p)return V.home();const w=S.wish.includes(p.id),rel=P.filter(x=>x.c===p.c&&x.id!==p.id).slice(0,4);
 return `<div class="pdg"><div class="im pdi" style="aspect-ratio:1/1">${pic(p)}<button class="back" onclick="back()" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></button>${off(p)>=1?`<span class="tag" style="left:auto;right:12px;top:14px">-${off(p)}%</span>`:''}</div>
<div class="det"><small>${p.c}</small><h1>${p.n}</h1><div class="rv">${stars(p.r)}<b>${p.r}</b><span>(${rv(p)} reviews)</span></div>
<div class="pp"><span class="pr" style="font-size:24px">${K(p.p)}</span><span class="old">${K(p.o)}</span><span class="save">Save ${off(p)}%</span></div>
<p class="desc">${p.d}</p>
<div class="act"><button class="ibig" data-w="${p.id}" onclick="togW(${p.id})" aria-label="Wishlist">${HEART(w)}</button><button class="btn" onclick="addC(${p.id})"><i class="fa-solid fa-cart-plus"></i>Add to Cart</button></div></div></div>
${rel.length?`<div class="sec"><h2>You may also like</h2></div><div class="grid">${rel.map(card).join('')}</div>`:''}`};

V.wish=()=>{const l=P.filter(p=>S.wish.includes(p.id));return `<h2 class="pg wrap">Wishlist</h2>`+(l.length?`<div class="grid">${l.map(card).join('')}</div>`:empty('fa-heart','No saved items yet','Tap the heart on anything you love.','Browse shop','shop'))};

const sumBox=()=>{const s=sub(),sh=ship();return `<div class="sum"><div><span>Subtotal</span><b>${K(s)}</b></div><div><span>Delivery</span><b>${sh?K(sh):(S.cart.length&&s>=10000?'FREE':'Set at checkout')}</b></div><div class="tot"><span>Total</span><span>${K(s+sh)}</span></div></div>`};

V.cart=()=>{if(!S.cart.length)return `<h2 class="pg wrap">Your Cart</h2>`+empty('fa-bag-shopping','Your cart is empty','Explore our Ankara prints, hoodies and sneakers.','Start shopping','shop');
 const s=sub(),need=10000-s;
 return `<h2 class="pg wrap">Your Cart <small style="color:#888;font-size:13px">(${qty()} items)</small></h2>
${S.cart.map((it,i)=>{const p=pr(it.id);return `<div class="li"><div class="im">${pic(p)}</div><div style="flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:6px;min-width:0"><div><div class="nm">${p.n}</div><div class="pr" style="font-size:15px">${K(p.p*it.n)}</div></div>
<div class="row" style="justify-content:space-between"><div class="qty"><button onclick="cq(${i},-1)">&minus;</button><span>${it.n}</span><button onclick="cq(${i},1)">+</button></div><button class="rm" onclick="cq(${i},-99)" aria-label="Remove"><i class="fa-regular fa-trash-can"></i></button></div></div></div>`}).join('')}
<div class="note"><i class="fa-solid fa-truck-fast"></i> ${need>0?`Add <b>${K(need)}</b> more for free delivery`:'You unlocked free nationwide delivery!'}</div>
<div class="sum"><div><span>Subtotal</span><b>${K(s)}</b></div><div><span>Delivery</span><b>Set at checkout</b></div><div class="tot"><span>Total</span><span>${K(s)}</span></div></div>
<div class="wrap" style="display:grid;gap:10px"><button class="btn" onclick="go('checkout')"><i class="fa-solid fa-mobile-screen-button"></i>Checkout with M-PESA</button><button class="btn gh" onclick="go('shop')">Continue shopping</button></div>`};

const steps=()=>`<div class="steps">${['Details','Payment','Done'].map((t,i)=>`<div class="step ${S.step>i+1?'ok':S.step===i+1?'on':''}">${S.step>i+1?'<i class="fa-solid fa-check"></i>':i+1}</div>${i<2?'<span style="width:18px;height:2px;background:#e4d9dc"></span>':''}`).join('')}</div>`;

V.checkout=()=>{if(!S.cart.length&&S.step<3)return V.cart();
 if(S.step===3){const o=S.last||{};return `<div class="empty" style="padding-top:36px"><i class="fa-solid fa-circle-check" style="color:#00A859;font-size:60px"></i><h3 style="font-size:22px;color:var(--dk)">Asante! Order confirmed</h3><p>M-PESA receipt <b>${o.code}</b></p><p>Paid ${K(o.total||0)} · ${o.n} items</p><p style="margin-top:8px">We're packing your order for delivery.</p><button class="btn" style="margin-top:18px" onclick="go('shop')">Keep shopping</button></div>`}
 if(S.step===2)return `<h2 class="pg wrap">Payment</h2>${steps()}<div class="mp"><i class="fa-solid fa-mobile-screen-button"></i><b>M-PESA STK Push</b><p>Prompt sent to +254 ${S.f.p}<br>Pay <b style="display:inline;font-size:15px">${K(sub()+ship())}</b> to VEE FASHION HOUSE</p></div>
<div class="wrap" style="display:grid;gap:10px">${sumBox()}<button class="btn" id="payb" onclick="pay()"><i class="fa-solid fa-lock"></i>Enter PIN &amp; pay ${K(sub()+ship())}</button><button class="btn gh" onclick="S.step=1;render()"><i class="fa-solid fa-arrow-left"></i>Edit details</button><p class="note" style="margin:0;text-align:center">Placeholder: M-PESA Daraja integration goes here. Payment is simulated.</p></div>`;
 return `<h2 class="pg wrap">Checkout</h2>${steps()}<div class="wrap"><form onsubmit="ck(event)">
<div class="field">Full name<input class="pill-in" id="fn" required value="${S.f.n||''}"></div>
<div class="field">M-PESA phone number<div class="row"><span class="pill-in" style="width:auto;font-weight:700;color:#555">+254</span><input class="pill-in" id="fp" required pattern="[0-9]{9}" inputmode="numeric" placeholder="712345678" value="${S.f.p||''}"></div></div>
<div class="field">Delivery zone<select class="pill-in" id="fz">${ZN.map(z=>`<option value="${z[0]}" ${S.zone===z[0]?'selected':''}>${z[1]} — ${K(z[0])}</option>`).join('')}</select></div>
<div class="field">County, town &amp; landmark<input class="pill-in" id="fa" required value="${S.f.a||''}"></div>
<button class="btn"><i class="fa-solid fa-arrow-right"></i>Continue to payment</button></form></div>${sumBox()}`};

V.account=()=>`<div class="wrap"><div class="prof"><i class="fa-solid fa-circle-user"></i><div><h3>Karibu Vee Fashion House</h3><small>Official online store · delivering across Kenya</small></div></div>
<div class="stats"><div><b>${S.wish.length}</b><span>Wishlist</span></div><div><b>${qty()}</b><span>In cart</span></div><div><b>${S.orders.length}</b><span>Orders</span></div></div>
<h3 class="sub">Order history</h3>${S.orders.length?S.orders.map(o=>`<div class="ord"><div><b>${o.code}</b><small>${o.date} · ${o.n} items</small></div><b>${K(o.total)}</b></div>`).join(''):'<p class="muted">No orders yet.</p>'}
<h3 class="sub">Help</h3><a class="lnk" href="tel:+254700123456"><i class="fa-solid fa-headset"></i>Customer helpline +254 700 123 456</a><div class="lnk"><i class="fa-solid fa-truck-fast"></i>Nationwide delivery, all counties</div><div class="lnk"><i class="fa-solid fa-mobile-screen-button"></i>Payments via M-PESA</div></div>`;

/* ----- actions ----- */
function gridRender(){const q=S.q.toLowerCase();let l=P.filter(p=>(S.cat==='All'||p.c===S.cat)&&(p.n+p.c).toLowerCase().includes(q));
 const so={pop:(a,b)=>b.r-a.r,rate:(a,b)=>b.r-a.r,low:(a,b)=>a.p-b.p,high:(a,b)=>b.p-a.p};l.sort(so[S.sort]||so.pop);
 $('cnt').textContent=l.length+' items';$('grid').innerHTML=l.length?l.map(card).join(''):empty('fa-magnifying-glass','No products found','Try another search or category.')}
function setCat(c){S.cat=c;go('shop')}
function openP(id){S.pid=id;go('product')}
function back(){go(S.prev&&!['product','checkout'].includes(S.prev)?S.prev:'home')}
function addC(id){const e=S.cart.find(i=>i.id===id);e?e.n++:S.cart.push({id,s:'',n:1});upd();toast('Added to cart')}
function cq(i,d){S.cart[i].n+=d;if(S.cart[i].n<1)S.cart.splice(i,1);upd();render(true)}
function syncW(id){const on=S.wish.includes(id);document.querySelectorAll('[data-w="'+id+'"]').forEach(b=>{b.classList.toggle('on',on);b.innerHTML=HEART(on)})}
function togW(id){const i=S.wish.indexOf(id);i<0?S.wish.push(id):S.wish.splice(i,1);upd();toast(i<0?'Saved to wishlist':'Removed from wishlist');if(S.v==='wish')render(true);else syncW(id)}
function ck(e){e.preventDefault();S.f={n:$('fn').value,p:$('fp').value,a:$('fa').value};S.zone=+$('fz').value;S.step=2;render();window.scrollTo(0,0)}
function pay(){const b=$('payb');b.disabled=true;b.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i>Waiting for PIN...';
 setTimeout(()=>{const o={code:'QK'+Math.random().toString(36).slice(2,9).toUpperCase(),date:new Date().toLocaleDateString('en-KE'),total:sub()+ship(),n:qty()};
 S.orders.unshift(o);S.last=o;S.cart=[];S.step=3;upd();render();toast('Payment received')},2200)}
function menu(o){$('ov').classList.toggle('s',!!o);$('dr').classList.toggle('s',!!o);
 if(o)$('dr').innerHTML=`<div class="dblob"><svg viewBox="0 0 300 150" preserveAspectRatio="none"><circle cx="250" cy="50" r="62" fill="#F3D7DF"/><circle cx="70" cy="140" r="44" fill="#E6B9C6" opacity=".6"/></svg><div class="lg">VEE <span>FASHION</span></div></div><div class="lg" style="display:none"></div><button onclick="menu(0);go('home')"><i class="fa-solid fa-house"></i>Home</button><button onclick="menu(0);go('shop')"><i class="fa-solid fa-store"></i>Shop all</button><button onclick="menu(0);go('wish')"><i class="fa-solid fa-heart"></i>Wishlist</button><button onclick="menu(0);go('cart')"><i class="fa-solid fa-bag-shopping"></i>Cart</button><button onclick="menu(0);go('account')"><i class="fa-solid fa-user"></i>Account</button><h4>Categories</h4>${CATS.slice(1).map(c=>`<button onclick="menu(0);setCat('${c[0]}')"><i class="fa-solid ${c[1]}"></i>${c[0]}</button>`).join('')}<h4>Help</h4><button onclick="location.href='tel:+254700123456'"><i class="fa-solid fa-headset"></i>+254 700 123 456</button>`}
function go(v){if(v==='checkout'&&S.v!=='checkout')S.step=1;if(v==='checkout'&&!S.cart.length){v='cart'}
 S.prev=S.v;S.v=v;menu(0);render();window.scrollTo(0,0)}

function render(soft){TM.forEach(clearInterval);TM=[];const v=S.v,y=window.scrollY;
 $('app').innerHTML=`<div class="${soft?'':'view'}">${(V[v]||V.home)()}</div>`;
 if(v==='shop')gridRender();
 if(v==='home'){initS('hot',Math.ceil(P.filter(p=>p.h).length/2),3500);initS('bn',BN.length,6500);const c=$('cats'),th=$('cthumb'),u=()=>{const m=c.scrollWidth-c.clientWidth;th.style.left=(m>0?c.scrollLeft/m*60:0)+'%'};c.addEventListener('scroll',u,{passive:true});u()}
 const IP={home:'<path d="M3 11 12 3l9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',shop:'<rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/>',wish:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21.3l8.8-8.9a5.5 5.5 0 0 0 0-7.8z"/>',account:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',more:'<circle cx="5" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="19" cy="12" r="1.8" fill="currentColor"/>'};
 const tabs=[['home','Home'],['shop','Shop'],['wish','Wishlist'],['account','Account'],['more','More']];
 const act=v==='checkout'||v==='cart'?'':v;
 $('nav').innerHTML=tabs.map(t=>{const on=act===t[0],fill=on&&(t[0]==='home'||t[0]==='wish')?'currentColor':'none';return `<button class="nv ${on?'on':''}" onclick="${t[0]==='more'?'menu(1)':`go('${t[0]}')`}"><svg viewBox="0 0 24 24" fill="${fill}" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">${IP[t[0]]}</svg>${t[1]}</button>`}).join('');
 upd();if(soft)window.scrollTo(0,y)}

render();
</script>
</body>
</html>
