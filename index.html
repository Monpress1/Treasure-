home(){

<div class="text-xs ${need>0?'text-gray-600':'text-emerald-600 font-bold'}"><i class="fa-solid fa-truck-fast mr-1"></i>${need>0?`Add <b>${K(need)}</b> more for free delivery`:'You unlocked free nationwide delivery!'}</div>
<div class="h-2 bg-gray-100 rounded-full overflow-hidden"><div class="h-full bg-gradient-to-r from-amber-500 to-brand-crimson rounded-full" style="width:${Math.min(100,s/100)}%"></div></div>
<div class="flex justify-between text-sm"><span class="text-gray-500">Subtotal</span><b>${K(s)}</b></div>
<div class="flex justify-between text-sm"><span class="text-gray-500">Delivery</span><b>${need>0?'Set at checkout':'FREE'}</b></div>
<button onclick="go('checkout')" class="w-full bg-brand-mpesa hover:bg-emerald-700 text-white font-black py-3.5 rounded-2xl shadow-lg flex items-center justify-center gap-2 text-sm"><i class="fa-solid fa-mobile-screen-button"></i>Checkout with M-PESA</button>
<button onclick="go('shop')" class="w-full text-xs font-bold text-gray-500">Continue shopping</button></div></div>`},

checkout(){const st=S.step;if(!S.cart.length&&st<3)return V.cart();
 const names=['Details','Payment','Done'];
 const bar=`<div class="flex items-center max-w-md mx-auto mb-6">${names.map((n,i)=>`<div class="flex flex-col items-center w-16"><span class="w-9 h-9 rounded-full flex items-center justify-center text-sm font-black ${st>i+1?'bg-brand-mpesa text-white':st===i+1?'bg-brand-crimson text-white shadow-lg':'bg-gray-200 text-gray-400'}">${st>i+1?'<i class="fa-solid fa-check"></i>':i+1}</span><span class="text-[10px] font-bold mt-1 ${st===i+1?'text-gray-900':'text-gray-400'}">${n}</span></div>${i<2?`<div class="flex-1 h-0.5 -mt-4 ${st>i+1?'bg-brand-mpesa':'bg-gray-200'}"></div>`:''}`).join('')}</div>`;
 let body='';
 if(st===1){const f=S.f;const inp='w-full px-3.5 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:bg-white focus:border-brand-mpesa focus:outline-none';
 body=`<form onsubmit="ck1(event)" class="bg-white rounded-3xl border border-gray-100 p-5 space-y-3.5"><h3 class="font-extrabold flex items-center gap-2"><i class="fa-solid fa-location-dot text-brand-crimson"></i>Delivery details</h3>
<input id="fn" required value="${f.name}" placeholder="Full name" class="${inp}">
<div class="relative"><span class="absolute left-3.5 top-3.5 text-sm font-bold text-gray-400">+254</span><input id="fp" required pattern="[0-9]{9}" value="${f.phone}" placeholder="712345678 (M-Pesa number)" class="${inp} pl-14 font-bold"></div>
<select id="fz" onchange="S.f.zone=+this.value;$('sumBox').innerHTML=sum()" class="${inp}">${ZN.map(z=>`<option value="${z[0]}" ${f.zone===z[0]?'selected':''}>${z[1]} &mdash; ${K(z[0])}</option>`).join('')}</select>
<input id="fa" required value="${f.addr}" placeholder="County, town & landmark / street" class="${inp}">
<button class="w-full bg-brand-crimson hover:bg-rose-800 text-white font-black py-3.5 rounded-2xl shadow-lg text-sm">Continue to payment <i class="fa-solid fa-arrow-right ml-1"></i></button></form>`}
 if(st===2){const tot=sub()+ship();body=`<div class="bg-white rounded-3xl border border-gray-100 p-6 text-center space-y-4"><span class="text-[10px] font-black text-brand-mpesa uppercase tracking-widest">M-Pesa STK Push</span>
<p class="text-xs text-gray-500">Prompt sent to <b class="text-gray-900">+254 ${S.f.phone}</b></p>
<div class="glow mx-auto w-56 rounded-[2.2rem] border-[7px] border-gray-900 bg-white overflow-hidden"><div class="bg-brand-mpesa text-white text-[10px] font-black py-2 tracking-[.3em]">M-PESA</div>
<div class="p-4 space-y-3 text-xs"><p>Pay <b>${K(tot)}</b> to <b>VEE FASHION HOUSE</b>?</p><div id="pins" class="flex justify-center gap-2">${'<span class="w-3 h-3 rounded-full bg-gray-300"></span>'.repeat(4)}</div><p class="text-[10px] text-gray-400">Enter your M-PESA PIN</p></div></div>
<button onclick="pay()" class="w-full bg-brand-mpesa hover:bg-emerald-700 text-white font-black py-3.5 rounded-2xl shadow-lg text-sm"><i class="fa-solid fa-lock mr-1"></i>Enter PIN &amp; pay ${K(tot)}</button>
<button onclick="S.step=1;render()" class="text-xs font-bold text-gray-500"><i class="fa-solid fa-arrow-left mr-1"></i>Edit details</button></div>`}
 if(st===3){const o=S.last||{};return `<div class="max-w-md mx-auto"><div class="text-center mb-4"><span class="w-16 h-16 bg-emerald-100 text-brand-mpesa rounded-full inline-flex items-center justify-center text-3xl"><i class="fa-solid fa-circle-check"></i></span>
<h2 class="text-2xl font-black mt-2">Asante! Order confirmed</h2><p class="text-xs text-gray-500">We're packing your order for delivery.</p></div>
<div class="bg-white rounded-3xl border border-gray-100 shadow-sm overflow-hidden"><div class="bg-brand-mpesa text-white px-5 py-3 flex justify-between items-center"><span class="font-black text-xs tracking-widest">M-PESA RECEIPT</span><b class="font-mono">${o.code}</b></div>
<div class="p-5 space-y-2.5 text-sm">${[['Paid',K(o.total||0)],['Items',o.n],['Deliver to',S.f.name],['Zone',o.zone],['Status','<span class="text-emerald-600">Dispatching via courier</span>']].map(r=>`<div class="flex justify-between"><span class="text-gray-500">${r[0]}</span><b class="text-right">${r[1]}</b></div>`).join('')}</div></div>
<div class="grid grid-cols-2 gap-2 mt-4"><button onclick="print()" class="bg-gray-200 font-bold py-3 rounded-2xl text-xs"><i class="fa-solid fa-print mr-1"></i>Print receipt</button><button onclick="go('shop')" class="bg-gray-900 text-white font-bold py-3 rounded-2xl text-xs">Keep shopping</button></div></div>`}
 return bar+`<div class="grid lg:grid-cols-5 gap-4 max-w-4xl mx-auto"><div class="lg:col-span-3">${body}</div><div id="sumBox" class="lg:col-span-2 h-fit">${sum()}</div></div>`},

me(){const row=(ic,l,v)=>`<div class="flex items-center gap-3 py-2.5"><i class="fa-solid ${ic} w-5 text-brand-crimson"></i><span class="text-gray-500 text-xs flex-1">${l}</span><b class="text-xs text-right">${v}</b></div>`;
 return `<div class="max-w-lg mx-auto space-y-4"><div class="bg-gradient-to-br from-brand-crimson to-amber-500 text-white rounded-3xl p-6 text-center shadow-lg"><div class="w-16 h-16 bg-white/20 rounded-full mx-auto flex items-center justify-center text-2xl font-black border-2 border-white/60">VF</div>
<h3 class="font-black text-lg mt-2">Karibu Vee Fashion House</h3><p class="text-xs text-white/80">Official online store &middot; delivering across Kenya</p></div>
<div class="grid grid-cols-3 gap-2">${[['fa-heart','Wishlist',S.wish.length,'wish'],['fa-bag-shopping','Cart',qty(),'cart'],['fa-receipt','Orders',S.orders.length,'me']].map(x=>`<button onclick="go('${x[3]}')" class="bg-white rounded-2xl border border-gray-100 p-3 text-center"><i class="fa-solid ${x[0]} text-brand-crimson"></i><p class="font-black text-lg">${x[2]}</p><p class="text-[10px] text-gray-400 font-bold">${x[1]}</p></button>`).join('')}</div>
<div class="bg-white rounded-2xl border border-gray-100 px-4 divide-y divide-gray-100">${row('fa-headset','Customer helpline','+254 700 123 456')}${row('fa-truck-fast','Delivery','Nationwide, all counties')}${row('fa-mobile-screen-button','Payments','M-Pesa STK Push')}</div>
<div class="bg-white rounded-2xl border border-gray-100 p-4"><h4 class="font-extrabold text-sm mb-2"><i class="fa-solid fa-receipt text-brand-crimson mr-2"></i>Order history</h4>${S.orders.length?S.orders.map(o=>`<div class="flex justify-between text-xs py-2 border-t border-gray-100"><span><b class="font-mono">${o.code}</b><br><span class="text-gray-400">${o.date} &middot; ${o.n} items</span></span><b>${K(o.total)}</b></div>`).join(''):'<p class="text-xs text-gray-400">No orders yet.</p>'}</div></div>`}
};

function sum(){const s=sub(),sh=ship();return `<div class="bg-white rounded-3xl border border-gray-100 p-5 space-y-3"><h3 class="font-extrabold text-sm">Order summary</h3>
${S.cart.map(it=>{const p=prod(it.id);return `<div class="flex gap-2.5 items-center">${im(p.i,'w-11 h-14 object-cover rounded-lg')}<div class="flex-1 text-xs"><p class="font-bold line-clamp-1">${p.t}</p><p class="text-gray-400">${it.s?'Size '+it.s+' · ':''}Qty ${it.n}</p></div><b class="text-xs">${K(p.p*it.n)}</b></div>`}).join('')}
<div class="border-t border-gray-100 pt-3 space-y-1.5 text-sm"><div class="flex justify-between text-gray-500"><span>Subtotal</span><b class="text-gray-900">${K(s)}</b></div><div class="flex justify-between text-gray-500"><span>Delivery</span><b class="text-gray-900">${sh?K(sh):'FREE'}</b></div>
<div class="flex justify-between font-black text-base pt-2 border-t border-gray-100"><span>Total</span><span class="text-brand-crimson">${K(s+sh)}</span></div></div></div>`}

/* ---------- ACTIONS ---------- */
function grid(){const q=S.q.toLowerCase();let l=P.filter(p=>(S.cat==='All'||p.c===S.cat)&&(p.t+p.c).toLowerCase().includes(q));
 l.sort({pop:(a,b)=>b.n-a.n,low:(a,b)=>a.p-b.p,high:(a,b)=>b.p-a.p,rate:(a,b)=>b.r-a.r}[S.sort]);
 $('cnt').textContent=l.length+' item'+(l.length==1?'':'s');
 $('grid').innerHTML=l.length?l.map(card).join(''):`<div class="col-span-full">${empty('fa-magnifying-glass','No products found','Try another search or category.')}</div>`}
function sl(n){S.slide=n;clearInterval(S.tm);S.tm=setInterval(()=>sl((S.slide+1)%SL.length),5000);
 document.querySelectorAll('.sl').forEach((e,i)=>e.classList.toggle('opacity-0',i!==n));
 document.querySelectorAll('.dt').forEach((e,i)=>e.className='dt h-2 rounded-full bg-white transition-all '+(i===n?'w-7':'w-2 opacity-50'))}
function srch(){S.q='';go('shop');setTimeout(()=>$('sq')&&$('sq').focus(),60)}
function tw(id){const i=S.wish.indexOf(id);i>-1?S.wish.splice(i,1):S.wish.push(id);toast(i>-1?'Removed from wishlist':'Saved to wishlist');
 if(S.view==='wish')render();else document.querySelectorAll(`[data-w="${id}"] i`).forEach(e=>e.className=(i>-1?'fa-regular':'fa-solid text-brand-crimson')+' fa-heart text-xs');upd()}
function add(id,s){s=s||dsz(prod(id));const e=S.cart.find(i=>i.id===id&&i.s===s);e?e.n++:S.cart.push({id,s,n:1});upd();toast('Added to cart')}
function cq(i,d){S.cart[i].n+=d;if(S.cart[i].n<=0)S.cart.splice(i,1);render()}
function qv(id){const p=prod(id);S.sz=dsz(p);
 $('sheetBody').innerHTML=`<button onclick="$('sheet').classList.add('hidden')" class="absolute top-3 right-3 z-10 bg-white/90 w-9 h-9 rounded-full shadow flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
<div class="grid md:grid-cols-2"><div class="aspect-square md:aspect-auto bg-gray-100 relative">${im(p.i,'w-full h-full object-cover')}<span class="absolute top-3 left-3 bg-brand-crimson text-white text-[10px] font-black px-2.5 py-1 rounded-md">${p.b}</span></div>
<div class="p-5 flex flex-col"><span class="text-[10px] font-bold text-amber-600 uppercase tracking-wider">${p.c}</span><h3 class="text-lg font-extrabold leading-snug">${p.t}</h3>
<div class="flex items-center gap-2 mt-1 text-xs">${stars(p.r)}<b>${p.r}</b><span class="text-gray-400">(${p.n} reviews)</span></div>
<div class="flex items-baseline gap-2 mt-3"><span class="text-2xl font-black text-brand-crimson">${K(p.p)}</span><span class="text-xs text-gray-400 line-through">${K(p.o)}</span></div>
<p class="text-xs text-gray-600 mt-3 leading-relaxed">${p.d}</p>
<p class="text-xs font-bold mt-4 mb-1.5 ${sizes(p).length?'':'hidden'}">Select shoe size</p><div class="flex flex-wrap gap-2">${sizes(p).map(s=>`<button data-s="${s}" onclick="sz('${s}')" class="szb px-3.5 py-2 text-xs font-bold border rounded-lg ${s===S.sz?'border-brand-crimson bg-rose-50 text-brand-crimson':'border-gray-200'}">${s}</button>`).join('')}</div>
<div class="mt-auto pt-5 flex gap-2"><button onclick="tw(${p.id})" data-w="${p.id}" class="w-12 rounded-xl border border-gray-200 flex items-center justify-center"><i class="${S.wish.includes(p.id)?'fa-solid text-brand-crimson':'fa-regular'} fa-heart"></i></button>
<button onclick="add(${p.id},S.sz);$('sheet').classList.add('hidden')" class="flex-1 bg-brand-crimson text-white font-bold py-3.5 rounded-xl text-sm shadow-md flex items-center justify-center gap-2"><i class="fa-solid fa-cart-plus"></i>Add to Cart</button></div></div></div>`;
 $('sheet').classList.remove('hidden')}
function sz(s){S.sz=s;document.querySelectorAll('.szb').forEach(b=>b.className='szb px-3.5 py-2 text-xs font-bold border rounded-lg '+(b.dataset.s===s?'border-brand-crimson bg-rose-50 text-brand-crimson':'border-gray-200'))}
function ck1(e){e.preventDefault();S.f={name:$('fn').value,phone:$('fp').value,zone:+$('fz').value,addr:$('fa').value};S.step=2;render();scrollTo({top:0})}
function pay(){if(S.pin)return;S.pin=1;const d=document.querySelectorAll('#pins span');let k=0;
 const t=setInterval(()=>{if(k<4)d[k++].className='w-3 h-3 rounded-full bg-brand-mpesa';else{clearInterval(t);fin()}},350)}
function fin(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ',r=()=>a[Math.random()*a.length|0],d=()=>Math.random()*10|0;
 const o={code:'Q'+r()+r()+d()+d()+d()+d()+d()+r()+r(),total:sub()+ship(),zone:ZN.find(z=>z[0]===S.f.zone)[1],n:qty(),date:new Date().toLocaleDateString()};
 S.orders.unshift(o);S.last=o;S.cart=[];S.pin=0;S.step=3;render();toast('Payment received')}

/* ---------- ROUTER ---------- */
function upd(){const n=qty(),w=S.wish.length;
 document.querySelectorAll('[data-b=cart]').forEach(e=>{e.textContent=n;e.classList.toggle('hidden',!n)});
 document.querySelectorAll('[data-b=wish]').forEach(e=>{e.textContent=w;e.classList.toggle('hidden',!w)});
 $('hTotal').textContent=K(sub());save()}
function go(v){clearInterval(S.tm);S.view=v;if(v!=='checkout'){S.step=1;S.pin=0}render();scrollTo({top:0})}
function render(){const v=S.view;$('app').innerHTML=`<div class="view">${V[v]()}</div>`;
 const t=v==='checkout'?'cart':v,i=T.findIndex(x=>x[0]===t);
 const x=(i*20+10)+'%';$('orb').style.left=x;$('notch').style.left=x;const oi=$('orbIcon');if(oi.dataset.i!==String(i)){oi.dataset.i=i;oi.className='fa-solid '+T[i][2];oi.animate&&oi.animate([{transform:'scale(.3) rotate(-90deg)',opacity:0},{transform:'none',opacity:1}],{duration:380,easing:'ease-out'})}
 document.querySelectorAll('.tab').forEach((b,j)=>b.classList.toggle('on',j===i));
 document.querySelectorAll('.dn').forEach(b=>b.classList.toggle('on',b.dataset.v===t));
 if(v==='home')sl(0);if(v==='shop')grid();upd()}

$('bar').innerHTML=T.map(t=>`<button onclick="go('${t[0]}')" class="tab flex flex-col items-center justify-end pb-2 gap-1"><i class="fa-solid ${t[2]} ti text-lg"></i><span class="text-[10px] font-bold">${t[1]}</span>${t[0]==='cart'||t[0]==='wish'?`<span data-b="${t[0]==='cart'?'cart':'wish'}" class="bdg hidden absolute top-2 right-[26%] bg-brand-crimson text-white text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center">0</span>`:''}</button>`).join('');
$('dnav').innerHTML=[T[0],T[1],T[4]].map(t=>`<button data-v="${t[0]}" onclick="go('${t[0]}')" class="dn px-4 py-2 rounded-full text-sm font-bold text-gray-600 hover:bg-gray-100"><i class="fa-solid ${t[2]} mr-1.5"></i>${t[1]}</button>`).join('');
render();
</script>
</body>
</html>
