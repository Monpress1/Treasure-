<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0c1116">
<title>Regenesis</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--sr:env(safe-area-inset-right,0px);--sl:env(safe-area-inset-left,0px);--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;overflow:hidden;background:#0c1116;color:#f2f5f3;font:13px/1.3 system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.p{position:fixed;background:rgba(12,18,22,.78);border:1px solid #ffffff26;border-radius:12px}
#hud{top:calc(8px + var(--st));left:calc(10px + var(--sl));padding:7px 10px;width:178px;font-size:12px;pointer-events:none}
.bar{height:7px;background:#ffffff22;border-radius:5px;overflow:hidden;margin:5px 0}.bar i{display:block;height:100%;background:#3dd68c;transition:width .2s}
button{font:inherit;color:#f2f5f3;background:#263840;border:1px solid #ffffff33;border-radius:10px;padding:7px 11px;cursor:pointer;touch-action:none}
button:disabled{opacity:.4}button.pri{background:#1f8a62}
.round{position:fixed;border-radius:50%;padding:0;font-weight:700;border:2px solid #ffffff55;background:#263840cc}
#top{position:fixed;top:calc(8px + var(--st));right:calc(10px + var(--sr));display:flex;gap:6px}
#msg{top:calc(8px + var(--st));left:50%;transform:translateX(-50%);padding:6px 12px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;max-width:50vw;overflow:hidden;text-overflow:ellipsis}
#e{position:fixed;left:50%;bottom:calc(16px + var(--sb));transform:translateX(-50%);display:none;background:#1f8a62;border-radius:20px;padding:10px 16px}
#fire{right:calc(26px + var(--sr));bottom:calc(22px + var(--sb));width:88px;height:88px;background:#b3323fdd;font-size:15px}
#swap{right:calc(126px + var(--sr));bottom:calc(30px + var(--sb));width:58px;height:58px;font-size:22px}
#aim{right:calc(30px + var(--sr));bottom:calc(122px + var(--sb));width:56px;height:56px;font-size:12px;background:#2d5a8acc}
#rel{right:calc(106px + var(--sr));bottom:calc(98px + var(--sb));width:48px;height:48px;font-size:11px}
#cross{position:fixed;left:50%;top:50%;width:10px;height:10px;margin:-5px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 3px #000;display:none;pointer-events:none;transition:transform .15s}
body.gun #cross{display:block;opacity:.5}body.aim #cross{opacity:1;transform:scale(.55)}
#hm{position:fixed;left:50%;top:50%;width:28px;height:28px;margin:-14px;pointer-events:none;opacity:0}
#hm.on,#hm.head,#hm.kill{animation:hm .22s ease-out}
#hm::before,#hm::after{content:"";position:absolute;left:50%;top:50%;width:28px;height:3px;margin:-1.5px -14px;background:#fff;box-shadow:0 0 3px #000}
#hm::before{transform:rotate(45deg)}#hm::after{transform:rotate(-45deg)}
#hm.head::before,#hm.head::after{background:#ffd23b}#hm.kill::before,#hm.kill::after{background:#ff3b3b}
@keyframes hm{0%{opacity:1;transform:scale(.6)}100%{opacity:0;transform:scale(1.35)}}
#scope{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .2s;background:radial-gradient(ellipse,transparent 55%,#000b)}body.aim #scope{opacity:1}
#hurt{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse,transparent 45%,#c81414cc)}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .8s}
#joyz{position:fixed;left:0;bottom:0;width:40%;height:70%}
#joy{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:#ffffff14;border:2px solid #ffffff33;pointer-events:none}
#joy.on{background:#ffffff22;border-color:#fff8}
#joy b{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:#eafff5cc}
#sa{position:fixed;left:0;top:0;width:var(--sl);height:var(--sb);visibility:hidden;pointer-events:none}
@media (pointer:fine){#joy,#joyz{display:none}}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:20}#modal.show{display:flex}
#mc{position:relative;width:min(640px,96vw);padding:12px 14px;max-height:92vh;overflow:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #fff1}
.sm{font-size:11px;color:#9fb3ad}
#brand{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;pointer-events:none;z-index:30;text-shadow:0 2px 14px #000;animation:bf 3.6s ease forwards}
#brand b{font-size:clamp(34px,9vw,64px);letter-spacing:.24em;font-weight:800;padding-left:.24em}
#brand small{letter-spacing:.32em;color:#9fb3ad;margin-top:6px}
@keyframes bf{0%{opacity:0}14%{opacity:1}70%{opacity:1}100%{opacity:0;visibility:hidden}}
#rot{position:fixed;inset:0;background:#0c1116;z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;font-size:18px;text-align:center;padding:20px}
#rot i{font-style:normal;font-size:54px;display:block;animation:rt 1.6s ease-in-out infinite}
@keyframes rt{0%,25%{transform:rotate(0)}65%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){#rot{display:flex}}
#hud{width:212px}
#hpw{display:flex;align-items:center;gap:6px;margin:5px 0}#hpw>span{font-size:16px;color:#ff5a5a}
#hpbar{flex:1;height:16px;margin:0;position:relative;border-radius:8px;border:1px solid #ffffff55;background:#00000066}
#hpbar i{border-radius:8px}
#hpt{position:absolute;inset:0;text-align:center;font:700 11px/15px system-ui;font-style:normal;text-shadow:0 1px 2px #000}
#gunp{top:calc(52px + var(--st));right:calc(10px + var(--sr));padding:7px 12px;text-align:right;pointer-events:none;min-width:112px}
#wn{font-size:12px;color:#9fb3ad;text-transform:uppercase;letter-spacing:.06em}#am{font-size:13px}#am b{font-size:28px;line-height:1.1}
#aim.on{background:#4aa3ff;border-color:#fff;box-shadow:0 0 12px #4aa3ffaa}
#ind{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.pin{cursor:pointer}
</style></head><body>
<canvas id="c"></canvas><canvas id="ind"></canvas><div id="scope"></div><div id="cross"></div><div id="hm"></div>
<div class="p" id="gunp"><div id="wn"></div><div id="am"></div></div><div class="p" id="hud"><div id="loc" class="sm"></div><div id="hpw"><span>❤</span><div class="bar" id="hpbar"><i></i><em id="hpt"></em></div></div><div>🪙 <b id="co"></b></div><div id="stat" class="sm" style="margin-top:3px;line-height:1.45"></div></div>
<div id="top"><button id="armb">⏸ Pause</button><button id="mapb" class="pri">🗺 Map</button></div>
<div id="msg" class="p"></div><button id="e" class="pri"></button>
<div id="joyz"></div><div id="joy"><b></b></div><div id="sa"></div>
<button id="aim" class="round">AIM</button><button id="rel" class="round">Reload</button><button id="swap" class="round">⇄</button><button id="fire" class="round">FIRE</button>
<div id="hurt"></div><div id="fade"></div>
<div id="modal"><div class="p" id="mc"></div></div>
<div id="brand"><b>REGENESIS</b><small>RESCUE · REBUILD</small></div>
<div id="rot"><i>📱</i>Rotate your phone to landscape to play Regenesis</div>
